version: 2
updates:
  # Dependencias npm: revisión semanal, PRs pequeñas y manejables
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies

  # Acciones de GitHub usadas en .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies

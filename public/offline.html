<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takt Studio — Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        color: #0f172a;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      }
      .logo {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 20px;
      }
      .logo span {
        color: #2563eb;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 24px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Takt <span>Studio</span></div>
      <h1 id="title"></h1>
      <p id="text"></p>
      <button id="retry" onclick="window.location.reload()"></button>
    </div>
    <script>
      var es = (navigator.language || "es").toLowerCase().indexOf("en") !== 0
      document.documentElement.lang = es ? "es" : "en"
      document.getElementById("title").textContent = es
        ? "Sin conexión"
        : "You are offline"
      document.getElementById("text").textContent = es
        ? "No hay conexión a internet. Las páginas que ya hayas visitado seguirán disponibles; vuelve a intentarlo cuando recuperes la conexión."
        : "No internet connection. Pages you have already visited will remain available; try again once you are back online."
      document.getElementById("retry").textContent = es ? "Reintentar" : "Retry"
    </script>
  </body>
</html>

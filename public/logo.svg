      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark sleek banner container -->
  <rect width="450" height="100" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>


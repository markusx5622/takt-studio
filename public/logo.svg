    " />
    <!-- Gear Inner Hole -->
    <circle cx="30" cy="30" r="11" fill="#0b0f19"/>
  </g>

  <!-- Typography -->
  <text x="110" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="38" letter-spacing="-0.5">Takt Studio</text>
</svg>
